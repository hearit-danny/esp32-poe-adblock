[platformio]
default_envs = m5stack-u138

[env:m5stack-u138]
; M5Stack ESP32 Ethernet Unit with PoE (U138). ESP32-D0WDQ6, 4 MB flash, no
; PSRAM, no Wi-Fi in use. IP101G PHY over RMII; the PHY drives a 50 MHz
; reference clock into GPIO0. Powered over PoE.
; Same pioarduino pin as Clawdmeter (arduino-esp32 3.3.8), already installed.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; Two 1.44 MB OTA app slots + two 544 KB raw blocklist slots (A/B swap). No
; LittleFS: uploads stream straight into the inactive raw slot.
board_build.partitions = partitions.csv

build_flags =
    ; Ethernet, passed to ETH.begin() in main.cpp. In arduino-esp32 3.x
    ; ETH_PHY_IP101 is an alias of ETH_PHY_TLK110 (same driver), and the
    ; argument order is (type, phy_addr, mdc, mdio, power, clk_mode).
    -DETH_PHY_ADDR_U138=1
    -DETH_PHY_MDC_U138=23
    -DETH_PHY_MDIO_U138=18
    ; No PHY power/reset pin on the U138.
    -DETH_PHY_POWER_U138=-1
    ; Blocked names answer 0.0.0.0 / :: (0) or NXDOMAIN (1). The admin page
    ; can flip this at runtime; that choice is stored in NVS and wins.
    -DDNS_BLOCK_NXDOMAIN=0
    ; TTL on blocked answers, seconds. Short so clients re-ask after a list change.
    -DDNS_BLOCKED_TTL=10
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
